appId: dev.erudiet.legion
productName: Legion
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
# Native modules (and node-pty's spawn-helper) must live outside the asar archive.
asarUnpack:
  - '**/*.node'
  - '**/node_modules/node-pty/**'
npmRebuild: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dir
  hardenedRuntime: true
  identity: null
linux:
  # `pnpm package` builds the unpacked dir (dist/linux[-arm64]-unpacked); `pnpm dist` an AppImage.
  category: Development
  executableName: legion
  synopsis: Orchestrates Claude Code and Codex agents from issue to draft PR.
  # Docks match running windows to the launcher entry by app_id / WM_CLASS = package.json desktopName.
  syncDesktopName: true
  target:
    - target: AppImage
win:
  # `pnpm package` builds the unpacked dir (dist/win[-arm64]-unpacked/Legion.exe); `pnpm dist` an NSIS installer.
  # Unsigned: SmartScreen warns on first launch until there is a code-signing certificate.
  target:
    - target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
